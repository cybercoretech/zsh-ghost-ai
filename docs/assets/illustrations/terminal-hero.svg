<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101722"/>
      <stop offset="100%" stop-color:#080B10"/>
    </linearGradient>
    <filter id="termGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect width="600" height="300" rx="16" fill="#080B10" stroke="#1F2A3B" stroke-width="1"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="600" height="44" rx="16" fill="#101722"/>
  <rect x="0" y="28" width="600" height="16" fill="#080B10"/>
  
  <!-- Dots -->
  <circle cx="22" cy="14" r="5" fill="#FF5F56"/>
  <circle cx="44" cy="14" r="5" fill="#FEBD2C"/>
  <circle cx="66" cy="14" r="5" fill="#27C93F"/>
  
  <!-- Title text -->
  <text x="100" y="28" font-family="JetBrains Mono, monospace" font-size="11" fill="#8493A5">zsh · ghost-ai · 󰀩</text>
  
  <!-- Terminal content -->
  <g transform="translate(30, 70)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="15" fill="#5C7087">&gt; </text>
    <text x="24" y="0" font-family="JetBrains Mono, monospace" font-size="15" fill="#E5EDF5" id="termTyped">git che</text>
    <text x="104" y="0" font-family="JetBrains Mono, monospace" font-size="15" fill="#00F0FF">▋</text>
    
    <!-- Ghost suggestion -->
    <text x="0" y="24" font-family="JetBrains Mono, monospace" font-size="15" fill="#5C7087">&gt; </text>
    <text x="24" y="24" font-family="JetBrains Mono, monospace" font-size="15" fill="#E5EDF5" opacity="0.4" id="termGhost">ckout main</text>
    <text x="132" y="24" font-family="JetBrains Mono, monospace" font-size="15" fill="#5C7087" opacity="0.4">▋</text>
  </g>
  
  <!-- Hint -->
  <text x="30" y="270" font-family="JetBrains Mono, monospace" font-size="12" fill="#8493A5" opacity="0.6">Press → to accept · Esc to dismiss</text>
  
  <!-- Subtle grid bg -->
  <rect width="600" height="300" rx="16" fill="none" stroke="#141C29" stroke-width="1" stroke-dasharray="2,2"/>
</svg>
