<!-- Ghost AI sigil: ghost head inside a terminal frame, the accept arrow forms the mouth -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gg-hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--accent-tertiary)"/>
      <stop offset="1" style="stop-color:var(--accent-primary)"/>
    </linearGradient>
    <linearGradient id="gg-glow" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0" style="stop-color:var(--accent-secondary)"/>
      <stop offset=".5" style="stop-color:var(--accent-primary)"/>
      <stop offset="1" style="stop-color:var(--accent-tertiary)"/>
    </linearGradient>
  </defs>
  <symbol id="ga-sigil" viewBox="0 0 120 120">
    <!-- terminal frame -->
    <rect x="8" y="8" width="104" height="104" rx="6" fill="none" stroke="var(--border)" stroke-width="2"/>
    <circle cx="16" cy="16" r="3" fill="var(--accent-tertiary)"/>
    <circle cx="23" cy="16" r="3" fill="var(--accent-secondary)"/>
    <circle cx="30" cy="16" r="3" fill="var(--accent-primary)"/>
    <!-- ghost head -->
    <path d="M42 48c-6 0-11 4-11 10s5 10 11 10 11-10 11-10-5-10-11-10Z" fill="none" stroke="var(--text-primary)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="47" cy="50" r="3" fill="var(--accent-primary)"/>
    <circle cx="73" cy="50" r="3" fill="var(--accent-secondary)"/>
    <!-- accept arrow mouth -->
    <path d="M56 70l4 4 4-4" fill="none" stroke="var(--accent-primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 74l4-4M60 66l4 4" fill="none" stroke="var(--text-muted)" stroke-width="2" opacity=".5"/>
    <!-- scanlines -->
    <path d="M42 62H78" fill="none" stroke="var(--accent-primary)" stroke-width="1" opacity=".3"/>
  </symbol>
  <!-- icons -->
  <symbol id="i-ghost" viewBox="0 0 24 24"><path d="M8 12c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="10" cy="10" r="2" fill="currentColor"/><path d="M14 16l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-node" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9V6M12 15v3M9 12H6M15 12h3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2L3 7v9c0 5 5 9 5 9s5-4 5-9V7Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
</svg>
