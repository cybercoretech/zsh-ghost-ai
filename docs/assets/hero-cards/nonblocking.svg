<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101722"/>
      <stop offset="100%" stop-color:#0A0D12"/>
    </linearGradient>
  </defs>
  <rect width="200" height="160" rx="14" fill="url(#cardGrad4)" stroke="#1F2A3B" stroke-width="1"/>
  
  <!-- Speed lines -->
  <path d="M40 46L90 46" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M52 40L52 52" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M70 40L70 52" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Typing indicator -->
  <rect x="140" y="38" width="4" height="12" rx="2" fill="#00F0FF" opacity="0.8">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="146" y="38" width="4" height="8" rx="2" fill="#00F0FF" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
  </rect>
  <rect x="152" y="38" width="4" height="4" rx="2" fill="#00F0FF" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
  </rect>
  
  <!-- Ghost text -->
  <rect x="140" y="56" width="30" height="6" rx="3" fill="#5C7087" opacity="0.3"/>
  
  <!-- Label -->
  <text x="34" y="80" font-family="JetBrains Mono, monospace" font-size="11" fill="#5C7087" letter-spacing="1">ASYNC</text>
  <text x="34" y="94" font-family="JetBrains Mono, monospace" font-size="10" fill="#8493A5" letter-spacing="0.5">NON-BLOCKING</text>
  
  <!-- Accent line -->
  <rect x="34" y="110" width="40" height="2" rx="1" fill="#0088FF" opacity="0.8"/>
</svg>
