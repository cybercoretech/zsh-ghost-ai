<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <defs>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- GHOST mark -->
  <g transform="translate(20, 12)">
    <path d="M40 10C30 10 22 18 22 28C22 38 30 46 40 46C50 46 58 38 58 28C58 18 50 10 40 10Z" fill="#101722" stroke="#1F2A3B" stroke-width="2"/>
    <path d="M22 28C22 38 30 46 40 46" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M40 46C50 46 58 38 58 28" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <circle cx="30" cy="20" r="2.5" fill="#E5EDF5"/>
    <circle cx="48" cy="20" r="2.5" fill="#E5EDF5"/>
    <rect x="36" y="34" width="10" height="4" rx="2" fill="#5C7087" opacity="0.5"/>
  </g>
  
  <!-- AI text -->
  <text x="92" y="56" font-family="Space Grotesk, JetBrains Mono, sans-serif" font-size="34" font-weight="700" fill="#E5EDF5" letter-spacing="-1">AI</text>
  
  <!-- GHOST AI wordmark -->
  <text x="24" y="54" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" fill="#8493A5" letter-spacing="2">GHOST</text>
  <text x="24" y="54" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" fill="#00F0FF" letter-spacing="2">OST</text>
</svg>
