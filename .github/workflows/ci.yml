name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: zsh ${{ matrix.zsh }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # zsh 5.8.1, the oldest supported
            zsh: "5.8"
          - os: ubuntu-24.04   # zsh 5.9
            zsh: "5.9"
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh, jq, shellcheck, and the plugins tested alongside
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh jq shellcheck python3 zsh-autosuggestions zsh-syntax-highlighting
      - name: Syntax
        run: |
          zsh --version
          for f in zsh-ghost-ai.plugin.zsh lib/*.zsh lib/providers/*.zsh functions/* tests/*.zsh; do
            [ -f "$f" ] || continue
            zsh -n "$f" || { echo "syntax error: $f"; exit 1; }
          done
      - name: shellcheck (POSIX installer scripts)
        run: |
          for f in install.sh uninstall.sh; do
            [ -f "$f" ] && shellcheck -s sh "$f"
          done
          true
      - name: Tests
        run: zsh tests/run.zsh
